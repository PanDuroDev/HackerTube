[phases.setup]
nixPkgs = ["...", "nodejs_22", "git"]

[phases.install]
cmds = [
  "...",
  "mkdir -p vendor",
  "git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git vendor/bgutil-ytdlp-pot-provider",
  "cd vendor/bgutil-ytdlp-pot-provider/server && npm update && npx tsc && npm prune --omit=dev"
]
