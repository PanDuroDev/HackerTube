name: Inspect HackerTube source archive

on:
  push:
    branches:
      - automation/inspect-hackertube-data

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safely unpack archive and inspect JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("hackertube-data.zip")
          output = Path("_extracted")
          output.mkdir()

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              print(f"ARCHIVE_ENTRIES={len(infos)}")
              for info in infos:
                  name = info.filename
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      print(f"SKIP_UNSAFE_PATH={name!r}")
                      continue
                  target = output.joinpath(*path.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))
                  print(f"FILE={name}\tSIZE={info.file_size}")

                  if target.suffix.lower() == ".json":
                      try:
                          value = json.loads(target.read_text(encoding="utf-8"))
                          if isinstance(value, list):
                              print(f"JSON_SUMMARY={name}\tTYPE=list\tCOUNT={len(value)}")
                              if value and isinstance(value[0], dict):
                                  print(f"JSON_KEYS={name}\t{','.join(sorted(value[0].keys()))}")
                          elif isinstance(value, dict):
                              print(f"JSON_SUMMARY={name}\tTYPE=dict\tKEYS={','.join(sorted(value.keys()))}")
                              for key, nested in value.items():
                                  if isinstance(nested, list):
                                      print(f"JSON_LIST={name}\t{key}\tCOUNT={len(nested)}")
                      except Exception as exc:
                          print(f"JSON_PARSE_ERROR={name}\t{type(exc).__name__}: {exc}")
          PY

      - name: Upload extracted source data
        uses: actions/upload-artifact@v4
        with:
          name: hackertube-extracted-source
          path: _extracted/
          if-no-files-found: error
          retention-days: 1
