name: Verify Hacker News import output

on:
  push:
    branches:
      - feat/hacker-news-catalog

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hacker-news-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate source data
        run: python -m pipeline.import_hacker_news
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Commit regenerated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hacker-news
          if git diff --cached --quiet; then
            echo "Generated data is reproducible."
          else
            git commit -m "data: regenerate Hacker News export with merged statistics"
            git push origin HEAD:feat/hacker-news-catalog
          fi
