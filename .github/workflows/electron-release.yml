name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.7
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            files: electron/dist/*.exe
            artifact: windows
          - os: macos-latest
            command: npm run dist:mac -- --universal
            files: electron/dist/*.dmg
            artifact: macos
          - os: ubuntu-latest
            command: npm run dist:linux
            files: electron/dist/*.AppImage
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: electron
        run: npm install
      - name: Build
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: electron-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: HackerTube ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
