name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Test Go search backend
        working-directory: backend
        run: go test ./...
      - name: Build Go search backend
        working-directory: backend
        run: |
          mkdir -p ../electron/backend-bin
          go build -trimpath -o ../electron/backend-bin/hackertube-backend .
      - name: Check frontend syntax
        run: |
          node --check public/search.js
          node --check public/app.js
      - name: Test search engine
        run: node --test tests/*.test.js
      - name: Compare Go and JavaScript search results
        run: node benchmarks/search-parity.js
      - name: Performance budgets
        run: node benchmarks/search-bench.js --assert
